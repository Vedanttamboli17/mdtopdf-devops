---
- name: Setup mdtopdf application server
  hosts: app_server
  become: yes

  vars:
    app_dir: /home/ubuntu/DevOps_Project

  tasks:

    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - rsync
        state: present

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
          gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) \
          signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
          tee /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create swap file
      command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    - name: Set swap permissions
      file:
        path: /swapfile
        mode: '0600'

    - name: Format swap
      command: mkswap /swapfile
      when: ansible_swaptotal_mb == 0

    - name: Enable swap
      command: swapon /swapfile
      when: ansible_swapfree_mb == 0

    - name: Make swap permanent
      lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy project files to server
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ app_dir }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=terraform/.terraform"
          - "--exclude=terraform/terraform.tfstate*"
        delete: yes
      become: no

    - name: Copy .env file
      copy:
        src: "{{ playbook_dir }}/../.env"
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        mode: '0600'

    - name: Build api service
      shell: docker compose build api
      args:
        chdir: "{{ app_dir }}"
      become: no

    - name: Build worker service
      shell: docker compose build worker
      args:
        chdir: "{{ app_dir }}"
      become: no

    - name: Build jenkins service
      shell: docker compose build jenkins
      args:
        chdir: "{{ app_dir }}"
      become: no

    - name: Start all services
      shell: docker compose up -d
      args:
        chdir: "{{ app_dir }}"
      become: no

    - name: Wait for API to be healthy
      uri:
        url: "http://localhost:8080/health"
        status_code: 200
      register: health
      retries: 10
      delay: 10
      until: health.status == 200